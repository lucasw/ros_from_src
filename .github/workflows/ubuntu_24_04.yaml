name: Ubuntu 20.04 Noetic ROS build from source

on:
  push:
  workflow_dispatch:

jobs:
  ubuntu2404dockeron2204:
    runs-on: ubuntu-22.04
    # env:
    steps:
      - name: git clone git@github.com:lucasw/ros_from_src
        uses: actions/checkout@v4
        with:
          path: ros_from_src
          submodules: recursive

      - name: docker build from source 24.04
        run: |
          cd ros_from_src
          docker build --build-arg IMAGE=ubuntu:24.04 --build-arg PYTHON_MINOR_VERSION=10 . -t ros2404
